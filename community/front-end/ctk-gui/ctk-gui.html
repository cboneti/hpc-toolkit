<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cluster Toolkit Blueprint Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .node-handle {
            position: absolute;
            width: 16px;
            height: 16px;
            background-color: #e0e7ff; /* Light Indigo */
            border: 2px solid #4f46e5; /* Indigo */
            border-radius: 50%;
            top: 50%;
            transform: translateY(-50%);
            cursor: crosshair;
            transition: all 0.2s;
            z-index: 20;
        }

        .node-handle:hover {
            background-color: #4f46e5;
            transform: translateY(-50%) scale(1.2);
        }

        /* Position the handles on the edges */
        .handle-input { left: -8px; }
        .handle-output { right: -8px; }
        /* Setup Inter font */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden; /* Prevent body scroll */
        }
        /* Custom styles for the connection points */
        .conn-point {
            @apply w-3 h-3 rounded-full cursor-pointer absolute transition-all duration-100 ease-in-out;
            border: 2px solid #555;
            background-color: white;
            z-index: 10;
        }
        .conn-point:hover {
            @apply ring-4 ring-offset-2 ring-indigo-500/50;
        }
        .input-point {
            left: -6px;
        }
        .output-point {
            right: -6px;
        }
        /* Style for the draggable module nodes */
        .module-node {
            /* This is the box around each module */
            @apply absolute bg-white p-3 rounded-xl shadow-lg border-2 border-gray-300 cursor-move transition-shadow hover:shadow-xl;
            min-width: 180px;
            max-width: 250px;
            user-select: none;
            z-index: 5;
        }
        .module-node.connecting {
             @apply border-indigo-500 shadow-2xl;
        }
        /* Style for the drag-and-drop canvas */
        #blueprint-canvas-container {
            @apply relative overflow-hidden bg-gray-100/50;
            width: 100%;
            height: calc(100vh - 64px); /* Full height minus header */
        }
        /* Ensures the SVG connections overlay the canvas but sit below the nodes */
        #connection-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Ignore mouse events on the SVG itself */
            z-index: 4;
        }

        /* Modal styling for confirmation (replacing alert/confirm) */
        #confirm-modal {
            @apply fixed inset-0 bg-gray-600 bg-opacity-75 flex items-center justify-center transition-opacity z-50;
        }
        .modal-content {
            @apply bg-white p-6 rounded-xl shadow-2xl w-full max-w-sm;
        }

        /* Responsive utilities */
        @media (max-width: 1024px) {
            #main-layout {
                grid-template-columns: 1fr;
            }
            #palette-sidebar, #settings-sidebar {
                display: none; /* Hide sidebars on smaller screens for simplicity */
            }
            #blueprint-canvas-container {
                height: calc(100vh - 64px);
            }
        }
    </style>
</head>
<body class="bg-gray-50">
<div class="h-16 bg-white shadow-md flex items-center px-6">
        <h1 class="text-2xl font-bold text-indigo-700">Blueprint DAG Editor</h1>

        <div class="ml-auto flex space-x-3">
            <input type="file" id="import-file" accept=".yaml,.yml" class="hidden" />
            <button onclick="document.getElementById('import-file').click()" class="bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 font-medium py-2 px-4 rounded-lg shadow-sm transition">
                Import YAML
            </button>

            <button id="generate-yaml-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg shadow-md transition duration-150">
                Generate YAML
            </button>
        </div>
    </div>

    <div class="h-16 bg-white shadow-md flex items-center px-6">
        <h1 class="text-2xl font-bold text-indigo-700">Blueprint DAG Editor</h1>
        <span class="ml-4 text-sm text-gray-500">Visualizing Infrastructure-as-Code Dependencies</span>
        <button id="generate-yaml-btn" class="ml-auto bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg shadow-md transition duration-150">
            Generate Blueprint YAML
        </button>
    </div>

    <!-- Main Layout: Palette | Canvas | Settings -->
    <div id="main-layout" class="grid grid-cols-[250px_1fr_300px] h-[calc(100vh-64px)] transition-[grid-template-columns] duration-300">

        <!-- 1. Module Palette (Left Sidebar) -->
        <div id="palette-sidebar" class="p-4 bg-gray-50 border-r overflow-y-auto">
            <h2 class="text-lg font-semibold mb-3 text-gray-700">Available Modules</h2>
            <div id="module-palette">
                <!-- Modules will be injected here by JS -->
            </div>
        </div>

        <!-- 2. Blueprint Canvas (Center) -->
        <div id="blueprint-canvas-container" ondrop="dropNode(event)" ondragover="allowDrop(event)">
            <svg id="connection-svg">
                <!-- Arrowhead Marker Definition -->
                <defs>
                    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                        <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f46e5" />
                    </marker>
                </defs>
            </svg>
            <!-- Nodes will be injected here by JS -->
            <p class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-gray-400 text-xl font-light pointer-events-none">
                Drag modules here to start building your blueprint.
            </p>
        </div>

        <!-- 3. Settings and Output (Right Sidebar) -->
        <div id="settings-sidebar" class="p-4 bg-white border-l overflow-y-auto flex flex-col transition-all duration-300">
            <div class="flex justify-between items-start mb-4">
                <h2 id="settings-header" class="text-lg font-semibold text-gray-700 whitespace-nowrap">Blueprint Settings & Output</h2>
                <button id="toggle-settings-btn" class="text-gray-500 hover:text-indigo-600 transition p-1 rounded-md ml-2">
                    <!-- Icon injected by JS -->
                </button>
            </div>

            <div id="settings-content" class="flex flex-col flex-grow">
                <div id="blueprint-vars" class="mb-6">
                    <h3 class="font-medium text-gray-600 mb-2">Default Variables</h3>
                    <input type="text" id="project-id" placeholder="project_id (e.g., my-gcp-project)" class="w-full p-2 border rounded-md text-sm mb-2 focus:ring-indigo-500 focus:border-indigo-500" value="my-default-project">
                    <input type="text" id="region" placeholder="region (e.g., us-central1)" class="w-full p-2 border rounded-md text-sm focus:ring-indigo-500 focus:border-indigo-500" value="us-central1">

                    <h3 class="font-medium text-gray-600 mt-4 mb-2">User-Defined Variables</h3>
                    <div id="custom-vars-container">
                        <!-- Dynamic variable inputs go here -->
                    </div>
                    <button id="add-var-btn" class="w-full mt-2 py-1.5 px-3 text-sm font-medium text-indigo-700 border border-indigo-300 rounded-lg hover:bg-indigo-50 transition duration-150 flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                        <span class="ml-1">Add Variable</span>
                    </button>
                </div>

                <h3 class="font-medium text-gray-600 mb-2">Generated YAML Output</h3>
                <textarea id="yaml-output" readonly rows="15" class="w-full text-xs p-3 border rounded-lg bg-gray-50 flex-grow resize-none font-mono"></textarea>
                <p id="message-box" class="mt-3 p-2 bg-yellow-100 text-yellow-800 rounded-lg hidden text-sm"></p>
            </div>
        </div>
    </div>

    <!-- Confirmation Modal (Hidden by default) -->
    <div id="confirm-modal" class="hidden">
        <div class="modal-content">
            <h3 class="text-lg font-bold text-gray-800 mb-4">Confirm Deletion</h3>
            <p id="confirm-modal-message" class="text-gray-700 mb-6"></p>
            <div class="flex justify-end space-x-3">
                <button id="modal-cancel-btn" class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-200 rounded-lg hover:bg-gray-300 transition">Cancel</button>
                <button id="modal-confirm-btn" class="px-4 py-2 text-sm font-medium text-white bg-red-600 rounded-lg hover:bg-red-700 transition">Delete</button>
            </div>
        </div>
    </div>

<script src="ctk-modules.js"></script>
<script src="ctk-gui.js"></script>
</body>
</html>
