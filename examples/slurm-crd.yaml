---

blueprint_name: slurm-crd

vars:
  project_id:  ## Set GCP Project ID Here ##
  deployment_name: slurm-crd
  region: us-central1
  zone: us-central1-c
  # Using an Ubuntu image compatible with both Slurm and CRD scripts
  slurm_image:
    family: slurm-gcp-6-11-ubuntu-2204-lts-nvidia-570
    project: schedmd-slurm-public

deployment_groups:
- group: primary
  modules:
  ####### Network #######
  - id: network
    source: modules/network/vpc
    settings:
      network_name: slurm-crd-net
      subnetwork_name: slurm-crd-subnet

  ####### Storage #######
  - id: homefs
    source: modules/file-system/filestore
    use: [network]
    settings:
      local_mount: /home

  ####### CRD Startup Script Generator #######
  # We use the chrome-remote-desktop module with instance_count: 0
  # to generate the correct startup script for the Slurm nodeset.
  - id: crd_script_gen
    source: community/modules/remote-desktop/chrome-remote-desktop
    settings:
      instance_count: 0
      install_nvidia_driver: true

  ####### CRD Nodeset #######
  - id: crd_nodeset
    source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
    use: [network]
    settings:
      instance_image: $(vars.slurm_image)
      machine_type: n1-standard-8
      guest_accelerator:
      - type: nvidia-tesla-t4-vws
        count: 1
      startup_script: $(crd_script_gen.startup_script)

  ####### CRD Partition #######
  - id: crd_partition
    source: community/modules/compute/schedmd-slurm-gcp-v6-partition
    use: [crd_nodeset]
    settings:
      partition_name: crd
      is_default: true

  ####### Slurm Login #######
  - id: slurm_login
    source: community/modules/scheduler/schedmd-slurm-gcp-v6-login
    use: [network]
    settings:
      instance_image: $(vars.slurm_image)
      machine_type: n2-standard-4

  ####### Slurm Controller #######
  - id: slurm_controller
    source: community/modules/scheduler/schedmd-slurm-gcp-v6-controller
    use:
    - network
    - homefs
    - crd_partition
    - slurm_login
    settings:
      instance_image: $(vars.slurm_image)
      machine_type: n2-standard-4
